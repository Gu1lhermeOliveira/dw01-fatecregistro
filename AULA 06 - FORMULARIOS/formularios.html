<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulários</title>
  </head>
  <body>
    <h1>Formulário de Inscrição</h1>

    <form method="post">
      <!-- input de texto -->
      <label for="nome">Nome:</label><br />
      <input
        name="nome"
        type="text"
        id="nome"
        placeholder="Digite seu nome completo..."
      /><br />
      <!-- input de email -->
      <label for="email">Email:</label><br />
      <input
        name="email"
        type="email"
        id="email"
        placeholder="Digite seu email"
      /><br />
      <!-- input de senha -->
      <label for="senha">Senha:</label><br />
      <input
        name="senha"
        type="password"
        id="senha"
        placeholder="Digite sua senha"
      /><br /><br />
      <!-- Botão de limpar o formulário -->
      <input type="reset" value="Limpar" />
      <!-- Botão de submeter o formulário -->
      <input type="submit" />
    </form>
    <br /><br />
    <hr />
    <h4>Outros inputs:</h4>

    <form action="">
      <!-- input de número -->
      <label for="quantidade">Quantidade:</label><br />
      <input type="number" /><br /><br />
      <!-- input de data -->
      <label for="data">Data:</label><br />
      <input type="date" /><br /><br />
      <!-- input de arquivo -->
      <label for="file">Arquivo:</label><br />
      <input type="file" id="file" /><br /><br />
      <!-- textarea -->
      <label for="comentario">Comentario</label><br /><br />
      <textarea rows="4" cols="40"></textarea>
      <!-- campo invisível -->
      <input type="hidden" name="id" value="9" /><br /><br />
      <!-- Caixa de seleção -->
      <label for="opcao">Escolha uma opção:</label><br />
      <select id="opcao" name="cursos">
        <br />
        <option value="opcao1">Programação</option>
        <option value="opcao2">Design</option>
        <option value="opcao3">Música</option>
        <option value="opcao4">Enfermagem</option></select
      ><br />
    </form>
    <br /><br />
    <hr />
    <h2>EXEMPLO DE FORMULÁRIO COMPLETO:</h2>
    <!-- FORMULÁRIO COMPLETO -->
    <form action="" method="post">
      <h4>Cadastro do Usuário</h4>
      <fieldset>
        <legend>Dados Pessoais</legend>
        <label for="nome">Nome:</label>
        <input
          type="text"
          id="nome2"
          name="nome2"
          placeholder="Insira seu nome" required
        /><br /><br>
        <label for="nasc">Data de Nascimento:</label>
        <input type="date" id="nasc" name="nasc" /><br /><br>
        <label for="sexo">Sexo:</label>
        <input type="radio" name="sexo" /> Masculino
        <input type="radio" name="sexo" /> Feminino
        <input type="radio" name="sexo" /> Prefiro Não Informar
      </fieldset>
      <br />
      <fieldset>
        <legend>Dados de endereço:</legend>
        <label for="rua">Rua:</label>
        <input
          type="text"
          id="rua"
          name="rua"
          placeholder="Insira o nome da sua rua"
        />
        <label for="numero">Número:</label>
        <input
          type="text"
          id="numero"
          name="numero"
          placeholder="Insira o número do seu endereço"
        /><br />
      </fieldset>
      <br />
      <fieldset>
        <legend>Dados do Produto:</legend>
        <label for="">Cor do Produto:</label>
        <input type="color" /><br><br>
        <!-- Campo Desativado -->
        <input type="text" placeholder="Este Campo Está desativado" disabled><br><br>
      
        <!-- Checkbox -->
        <input type="checkbox"/> Li e Aceito os termos de uso <br /><br />
        <input type="submit" value="Cadastrar" />
        <input type="reset" value="Limpar" />
      </fieldset>
    </form>
  </body>
</html>
