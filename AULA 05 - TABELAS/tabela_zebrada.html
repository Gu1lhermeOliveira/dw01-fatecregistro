<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>Tabela Zebrada</title>
  </head>
  <body>
    <!-- Tabela zebrada -->
    <table border="1" align="center">
      <thead>
        <tr>
          <th colspan="6">
            <h3>Tabela de Clientes</h3>
          </th>
        </tr>
        <tr>
          <th scope="col" colspan="3">Dados Pessoais:</th>
          <th scope="col" colspan="2">Endereço:</th>
          <th scope="col">Contato:</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <!-- Dados Pessoais -->
          <th scope="col">Nome:</th>
          <th scope="col">Idade:</th>
          <th scope="col">Profissão</th>
          <!-- Endereço -->
          <th scope="col">Rua:</th>
          <th scope="col">Cidade:</th>
          <!-- Contato -->
          <th scope="col">E-mail:</th>
        </tr>
        <tr>

          <td>São Paulo</td>
          <td>ana.souza@email.com</td>
        </tr>
        <tr>
            <td>João Ricardo das Neves</td>
            <td>30</td>

            <td>Av. Brasil</td>
            <td>RIo de Janeiro</td>

        </tr>
      </tbody>
    </table>
  </body>
</html>
