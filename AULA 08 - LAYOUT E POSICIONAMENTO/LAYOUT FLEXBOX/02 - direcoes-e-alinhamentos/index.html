<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Direções e Alinhamentos - Flexbox</title>
    <!-- Importar o arquivo de estilo -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>Flexbox- Direções e Alinhamentos</h2>

    <p>Linha ao Centro</p>
    <div class="container row-center">
      <div class="card">A</div>
      <div class="card">B</div>
      <div class="card">C</div>
    </div>

    <p>Coluna à esquerda</p>
    <div class="container column-center">
      <div class="card">A</div>
      <div class="card">B</div>
      <div class="card">C</div>
    </div>

    <p>Linha espaçada (space-between)</p>
    <div class="container row-space-between">
      <div class="card">A</div>
      <div class="card">B</div>
      <div class="card">C</div>
    </div>

    <p>Linha com espaço em volta (space-around)</p>
    <div class="container row-space-around">
      <div class="card">A</div>
      <div class="card">B</div>
      <div class="card">C</div>
    </div>

    <p>Quebra de Linha (flex-wrap)</p>
    <div class="container flex-wrap">
      <div class="card cardMaior">1</div>
      <div class="card cardMaior">2</div>
      <div class="card cardMaior">3</div>
      <div class="card cardMaior">4</div>
      <div class="card cardMaior">5</div>
      <div class="card cardMaior">6</div>
      <div class="card cardMaior">7</div>
      <div class="card cardMaior">8</div>
      <div class="card cardMaior">9</div>
      <div class="card cardMaior">10</div>
    </div>

    <p>desafio 1</p>
    <div class="container row-center2">
      <div class="card">A</div>
      <div class="card">B</div>
      <div class="card">C</div>
    </div>

      <p>desafio 2</p>
    <div class="container row-center3">
      <div class="card">A</div>
      <div class="card">B</div>
      <div class="card">C</div>
    </div>

      <p>desafio 3</p>
    <div class="container row-center4">
      <div class="card">A</div>
      <div class="card">B</div>
      <div class="card">C</div>
    </div>

      <p>desafio 4</p>
    <div class="container row-center5">
      <div class="card">A</div>
      <div class="card">B</div>
      <div class="card">C</div>
    </div>


  </body>
</html>
