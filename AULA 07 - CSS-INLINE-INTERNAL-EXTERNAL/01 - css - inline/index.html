<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Inline</title>
</head>
<body>
    <h1>Demonstração do CSS Inline</h1>
    <p style="color: blue; font-size: 18px;">Este parágrafo utiliza CSS inline através do atributo style.</p>
    <p style="color: red; font-weight: bold; background-color: yellow;">Este é outro parágrafo com múltiplas propriedades CSS Inline.</p>

    <!-- padding: espaçamento interno / margin: espaçamento externo -->
    <div style="border: 2px solid green; width: 400px; padding: 30px; margin: 50px;">
        Está é uma div estilizada com CSS inline.
    </div>

    <h2 style="color: #774af5; text-align: center;">
        Título Centralizado com cor hexadecimal
    </h2>


    <div style="height: 400px; width: 600px; background-color: orange; color: white; font-size: 32px; text-align: center;">
        Desafio css inline.
    </div>
</body>
</html>
